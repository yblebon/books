<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Reading Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:      #1a1710;
      --ink-mid:  #2e2b22;
      --ink-soft: #3d3926;
      --gold:     #c9a84c;
      --gold-dim: #8a6f2e;
      --cream:    #f2ead8;
      --cream-dim:#d8cebc;
      --muted:    #7a7260;
      --border:   rgba(201,168,76,.18);
      --sidebar:  260px;
      --radius:   4px;
      --ease:     cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--ink);
      color: var(--cream);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────────── */
    aside {
      width: var(--sidebar);
      flex-shrink: 0;
      background: var(--ink-mid);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-brand {
      padding: 2rem 1.6rem 1.4rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: .02em;
      color: var(--gold);
    }
    .sidebar-brand p {
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-top: .3rem;
    }
    .sidebar-controls {
      padding: .8rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-controls span {
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sort-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--cream-dim);
      font-size: .68rem;
      letter-spacing: .06em;
      padding: .3rem .7rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .sort-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
    #author-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: .5rem 0;
      scrollbar-width: thin;
      scrollbar-color: var(--ink-soft) transparent;
    }
    .author-item {
      padding: .65rem 1.6rem;
      font-size: .82rem;
      color: var(--cream-dim);
      cursor: pointer;
      transition: background .15s, color .15s, padding-left .15s;
      border-left: 2px solid transparent;
    }
    .author-item:hover { background: rgba(201,168,76,.07); color: var(--cream); padding-left: 2rem; }
    .author-item.active { background: rgba(201,168,76,.1); color: var(--gold); border-left-color: var(--gold); padding-left: 2rem; }
    .clear-btn {
      display: none;
      width: calc(100% - 3.2rem);
      margin: .6rem 1.6rem;
      padding: .45rem;
      background: none;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: .72rem;
      cursor: pointer;
      letter-spacing: .06em;
      transition: color .2s, border-color .2s;
      font-family: 'Lora', serif;
    }
    .clear-btn:hover { color: var(--gold); border-color: var(--gold-dim); }
    .clear-btn.visible { display: block; }

    /* ── Main ────────────────────────────────────────────────────────────── */
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar {
      padding: 1.4rem 2rem;
      background: var(--ink-mid);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .search-wrap { position: relative; flex: 1; max-width: 540px; }
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    #search-input {
      width: 100%;
      padding: .7rem 1rem .7rem 2.6rem;
      background: var(--ink-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--cream);
      font-family: 'Lora', serif;
      font-size: .88rem;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    #search-input::placeholder { color: var(--muted); }
    #search-input:focus { border-color: var(--gold-dim); background: rgba(201,168,76,.04); }
    .result-count { font-size: .75rem; color: var(--muted); white-space: nowrap; }

    /* ── Grid ────────────────────────────────────────────────────────────── */
    #book-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      overflow-y: auto;
      align-content: start;
      scrollbar-width: thin;
      scrollbar-color: var(--ink-soft) transparent;
    }

    /* ── Skeleton ────────────────────────────────────────────────────────── */
    .skeleton { background: var(--ink-mid); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
    @keyframes shimmer {
      0%   { background-position: -700px 0; }
      100% { background-position:  700px 0; }
    }
    .skeleton-img, .skeleton-line {
      background: linear-gradient(90deg, var(--ink-soft) 25%, #3f3b2e 50%, var(--ink-soft) 75%);
      background-size: 700px 100%;
      animation: shimmer 1.6s infinite linear;
    }
    .skeleton-img  { height: 180px; width: 100%; }
    .skeleton-body { padding: 1.4rem; display: flex; flex-direction: column; gap: .7rem; }
    .skeleton-line { height: .8rem; border-radius: 3px; }
    .skeleton-line.short  { width: 60%; }
    .skeleton-line.medium { width: 80%; }

    /* ── Cards ───────────────────────────────────────────────────────────── */
    .book-card {
      background: var(--ink-mid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
      animation: fadeUp .4s var(--ease) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
      border-color: var(--gold-dim);
    }
    .book-image-wrap { overflow: hidden; position: relative; }
    .book-image-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(26,23,16,.6));
      pointer-events: none;
    }
    .book-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      transition: transform .4s var(--ease);
      background: var(--ink-soft);
    }
    .book-card:hover .book-image { transform: scale(1.04); }
    .extract {
      padding: 1.4rem 1.6rem;
      font-style: italic;
      font-size: .88rem;
      line-height: 1.75;
      color: var(--cream-dim);
      flex: 1;
      position: relative;
    }
    .extract::before {
      content: '\201C';
      position: absolute;
      top: .1rem;
      left: .9rem;
      font-size: 3.8rem;
      color: var(--gold);
      opacity: .2;
      font-family: 'Playfair Display', serif;
      line-height: 1;
      pointer-events: none;
    }
    .extract-text {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      padding-left: .5rem;
    }
    .book-info {
      padding: 1rem 1.6rem 1.4rem;
      border-top: 1px solid var(--border);
    }
    .book-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: .3rem;
      line-height: 1.3;
    }
    .book-meta { font-size: .75rem; color: var(--muted); }
    .author-link {
      color: var(--gold-dim);
      cursor: pointer;
      transition: color .15s;
    }
    .author-link:hover { color: var(--gold); }

    /* ── States ──────────────────────────────────────────────────────────── */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .state-msg .state-icon { font-size: 2.5rem; display: block; margin-bottom: 1rem; opacity: .5; }
    .state-msg.error { color: #e87070; }
    .state-msg strong { display: block; margin-bottom: .4rem; font-family: 'Playfair Display', serif; font-size: 1.1rem; }
    .state-msg small { font-size: .78rem; opacity: .7; }
  </style>
</head>
<body>

  <aside>
    <div class="sidebar-brand">
      <h1>The Reading Room</h1>
      <p>Literary Collection</p>
    </div>
    <div class="sidebar-controls">
      <span>Authors</span>
      <button class="sort-btn" id="sort-btn">A → Z</button>
    </div>
    <button class="clear-btn" id="clear-btn">✕ Clear filter</button>
    <ul id="author-list" role="list" aria-label="Filter by author"></ul>
  </aside>

  <main>
    <div class="top-bar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="search" id="search-input" placeholder="Search titles, authors, excerpts…" aria-label="Search books" autocomplete="off" />
      </div>
      <span class="result-count" id="result-count" aria-live="polite"></span>
    </div>
    <div id="book-grid" role="list" aria-label="Book collection">
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line medium"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line medium"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line medium"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line medium"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line medium"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line medium"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    </div>
  </main>

  <script>
    const API_URL = 'https://static-conf.vercel.app/go/books';
    const FALLBACK_IMG = 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=600&q=80';

    let allBooks = [];
    let activeAuthor = null;
    let sortAsc = true;

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function init() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const data = await res.json();
        allBooks = Array.isArray(data) ? data : (data.books ?? data.data ?? []);
        renderAuthors();
        renderBooks(allBooks);
      } catch (err) {
        document.getElementById('book-grid').innerHTML = `
          <div class="state-msg error" role="alert">
            <span class="state-icon">⚠</span>
            <strong>Could not load the library</strong>
            ${esc(err.message)}
            <br/><small>Open the browser console (F12) for details.</small>
          </div>`;
      }
    }

    function renderAuthors() {
      const names = [...new Set(allBooks.map(b => b.author).filter(Boolean))];
      names.sort((a, b) => sortAsc ? a.localeCompare(b) : b.localeCompare(a));
      const list = document.getElementById('author-list');
      list.innerHTML = '';
      names.forEach(name => {
        const li = document.createElement('li');
        li.className = 'author-item' + (name === activeAuthor ? ' active' : '');
        li.setAttribute('role', 'button');
        li.setAttribute('tabindex', '0');
        li.textContent = name;
        const activate = () => setAuthorFilter(name);
        li.addEventListener('click', activate);
        li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') activate(); });
        list.appendChild(li);
      });
    }

    function renderBooks(data) {
      const grid = document.getElementById('book-grid');
      const count = document.getElementById('result-count');
      if (!data.length) {
        grid.innerHTML = `<div class="state-msg" role="status"><span class="state-icon">📖</span><strong>No books found</strong>Try a different search or clear the filter.</div>`;
        count.textContent = '';
        return;
      }
      count.textContent = `${data.length} book${data.length !== 1 ? 's' : ''}`;
      grid.innerHTML = data.map((b, i) => {
        const extract = b.extrait || b.extract || 'No excerpt available.';
        const imageUrl = b.image || FALLBACK_IMG;
        return `
          <article class="book-card" role="listitem" style="animation-delay:${Math.min(i*50,400)}ms">
            <div class="book-image-wrap">
              <img class="book-image" src="${esc(imageUrl)}" alt="${esc(b.title || 'Book cover')}" loading="lazy" onerror="this.src='${FALLBACK_IMG}';this.onerror=null;" />
            </div>
            <div class="extract" aria-label="Excerpt">
              <p class="extract-text">${esc(extract)}</p>
            </div>
            <div class="book-info">
              <h2 class="book-title">${esc(b.title || 'Untitled')}</h2>
              <p class="book-meta">By <span class="author-link" role="button" tabindex="0" data-author="${esc(b.author || '')}">${esc(b.author || 'Unknown')}</span>${b.date ? ` · ${esc(b.date)}` : ''}</p>
            </div>
          </article>`;
      }).join('');
      grid.querySelectorAll('[data-author]').forEach(el => {
        el.addEventListener('click', () => setAuthorFilter(el.dataset.author));
        el.addEventListener('keydown', e => { if (e.key === 'Enter') setAuthorFilter(el.dataset.author); });
      });
    }

    function setAuthorFilter(name) {
      activeAuthor = name;
      document.getElementById('search-input').value = name;
      document.getElementById('clear-btn').classList.add('visible');
      renderAuthors();
      applySearch();
    }

    function clearFilter() {
      activeAuthor = null;
      document.getElementById('search-input').value = '';
      document.getElementById('clear-btn').classList.remove('visible');
      renderAuthors();
      renderBooks(allBooks);
      document.getElementById('result-count').textContent = `${allBooks.length} books`;
    }

    function applySearch() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      if (!q) { clearFilter(); return; }
      document.getElementById('clear-btn').classList.add('visible');
      const filtered = allBooks.filter(b =>
        (b.title?.toLowerCase().includes(q)) ||
        (b.author?.toLowerCase().includes(q)) ||
        ((b.extrait || b.extract)?.toLowerCase().includes(q))
      );
      renderBooks(filtered);
    }

    document.getElementById('search-input').addEventListener('input', () => {
      activeAuthor = null;
      renderAuthors();
      applySearch();
    });
    document.getElementById('clear-btn').addEventListener('click', clearFilter);
    document.getElementById('sort-btn').addEventListener('click', () => {
      sortAsc = !sortAsc;
      document.getElementById('sort-btn').textContent = sortAsc ? 'A → Z' : 'Z → A';
      renderAuthors();
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
